name: Lint

on:
  push:
    branches: [main, dev]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/lint.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/lint.yml"
  workflow_dispatch:

jobs:
  ruff:
    name: Ruff (check + format)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        # Pin the same version configured in pyproject.toml [project.optional-dependencies.dev]
        # so CI and local lint agree byte-for-byte.
        run: pip install ruff==0.15.14

      - name: ruff check
        run: ruff check src/ tests/

      - name: ruff format --check
        run: ruff format --check src/ tests/
